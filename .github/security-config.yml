# Security Configuration for Enhanced Security Scanning
# Migration from Azure DevOps security pipeline configuration

security:
  # Tool versions (matching Azure DevOps setup)
  tools:
    tfsec:
      version: "v1.28.4"
      checksum: "sha256:e8c83a6e2bb6b1c7d0c0e3e9e8b8c9d5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1"
      args:
        - "--include-passed"
        - "--detailed-exit-code"
        - "--soft-fail"
      
    checkov:
      version: "v3.1.34"
      frameworks:
        - "terraform"
        - "kubernetes"
        - "dockerfile" 
        - "secrets"
        - "github_configuration"
      args:
        - "--soft-fail"
        - "--quiet"
        - "--compact"
      
    terrascan:
      version: "v1.18.11"
      checksum: "sha256:f9d94a7f3e5c6b8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2"
      policy_types:
        - "aws"
        - "azure" 
        - "gcp"
        - "kubernetes"
      args:
        - "--verbose"

  # Failure thresholds (configurable per environment)
  thresholds:
    production:
      critical: 0
      high: 5
      fail_on_critical: true
      fail_on_high: false
      
    staging:
      critical: 2
      high: 10
      fail_on_critical: true
      fail_on_high: false
      
    development:
      critical: 5
      high: 20
      fail_on_critical: false
      fail_on_high: false

  # Scan scopes and paths
  scan_paths:
    terraform:
      - "terraform/"
      - "pulumi/"
      - "**/infrastructure/"
      
    kubernetes:
      - "apps/"
      - "charts/"
      - "manifests/"
      
    containers:
      - "apps/**/deployment.yaml"
      - "apps/**/statefulset.yaml"
      - "charts/**/values.yaml"
      - "**/Dockerfile"

  # Report configuration
  reporting:
    formats:
      - "json"
      - "sarif"
      - "markdown"
      
    retention_days: 30
    
    sarif:
      upload_to_github: true
      merge_reports: true
      
    artifacts:
      - "security-reports/"
      - "sarif-reports/"
      - "consolidated-report.md"

  # Checksum verification (security best practice)
  checksum_verification:
    enabled: true
    fail_on_mismatch: true
    trusted_sources:
      - "github.com/aquasecurity/tfsec"
      - "github.com/bridgecrewio/checkov"
      - "github.com/tenable/terrascan"

  # Advanced configuration
  advanced:
    parallel_scans: true
    cache_tools: true
    timeout_minutes: 30
    
    # Custom rules and policies
    custom_policies:
      terraform:
        - ".security/terraform-policies/"
      kubernetes:
        - ".security/k8s-policies/"
    
    # Exclusions and allowlists
    exclusions:
      paths:
        - "examples/"
        - "test/"
        - "**/vendor/"
      
      rules:
        # Example: Exclude specific rules that are not applicable
        - "AWS002"  # S3 bucket public read
        - "GCP001"  # Example GCP rule
      
      files:
        - "*.example.tf"
        - "test-*.yaml"

  # Integration settings
  integrations:
    github_code_scanning:
      enabled: true
      category_prefix: "security-scan"
      
    slack_notifications:
      enabled: false
      webhook_url: ""  # Set in GitHub Secrets
      channels:
        critical: "#security-alerts"
        summary: "#devops-notifications"
        
    jira_integration:
      enabled: false
      project_key: "SEC"
      issue_type: "Security Issue"

# Environment-specific overrides
environments:
  production:
    security:
      thresholds:
        critical: 0
        high: 0
        fail_on_critical: true
        fail_on_high: true
      
      advanced:
        timeout_minutes: 60
        
  staging:
    security:
      thresholds:
        critical: 1
        high: 5
        
  development:
    security:
      advanced:
        parallel_scans: false  # Reduce resource usage in dev