version: '3'

silent: true

includes:
  cli: ./tasks/cli.yaml
  csi: ./tasks/csi.yaml
  postgres: ./tasks/postgres.yaml
  tailscale: ./tasks/tailscale.yaml
  argocd: ./tasks/argocd.yaml
  prometheus-operator: ./tasks/prometheus-operator.yaml
  namespaces: ./tasks/namespaces.yaml
  1password: ./tasks/1password.yaml
  vault: ./tasks/vault.yaml
  vultr: ./tasks/vultr.yaml
  tf: ./tasks/terraform.yaml
  secrets: ./tasks/secrets.yaml
  cluster: ./tasks/cluster.yaml
  matrix: ./tasks/matrix.yaml
  test: ./tasks/test.yaml
  talos: ./tasks/talos.yaml
  commit: ./tasks/commit.yaml
  milvus: ./tasks/milvus.yaml
  utilities: ./tasks/utilities.yaml
  maintenance: ./tasks/maintenance.yaml

vars:
  PATH_ERROR: is not installed or correctly configured in PATH.
  K8S_VERSION: 1.28.1

dotenv: ['.env']

tasks:
  clear:
    cmds:
      - sleep 0.1 && {{.CLEAR}}

  explain:
    desc: Explains a certain Task command more in-detail
    cmds:
      - task {{.CLI_ARGS}} --summary

  lint:
    desc: Performs lint testing on the YAML files in the repository using the yamllint tool to ensure proper formatting and syntax.
    preconditions:
      - sh: "which yamllint"
        msg: "yamllint {{.PATH_ERROR}}"
    cmds:
      - yamllint -c ./.yamllint .

  docs:gen:
    preconditions:
      - sh: 'which terraform-docs'
        msg: 'terraform-docs {{.PATH_ERROR}}'
    dir: terraform
    desc: Build documentation using Terraform-docs
    cmds:
      - terraform-docs markdown -c .terraform-docs.yaml . --output-file README.md

  local:
    desc: local-path storage
    preconditions:
      - sh: "which kustomize"
        msg: "kustomize {{.PATH_ERROR}}"
    cmds:
      - kustomize build "github.com/rancher/local-path-provisioner/deploy?ref=v0.0.22" | kubectl apply -f -

  validate:
    preconditions:
      - sh: "which kubeconform"
        msg: "kubeconform {{.PATH_ERROR}}"
    desc: Validates your Yaml objects in the repository using Kubeconform
    cmds:
      - |
        objectTypes=("svc" "deployment" "*secret" "cm" "pvc" "pv" "role" "sa" "cr" "rb");
        for obj in "${objectTypes[@]}"; do
          echo -e "\nValidating ${obj^} object files";
          find . -maxdepth 20 -name ${obj}.yaml -exec kubeconform -summary -exit-on-error -ignore-missing-schemas -kubernetes-version "{{.K8S_VERSION}}" -schema-location default {} \;
        done
    silent: true

  validate:comprehensive:
    desc: Comprehensive validation including kustomize builds and ArgoCD apps
    deps: [validate]
    cmds:
      - task: maintenance:validate:kustomize
      - task: maintenance:validate:argocd
      - task: maintenance:validate:helm
      - echo "✅ Comprehensive validation completed"

  calc:
    preconditions:
      - sh: "which kuota-calc"
        msg: "kuota-calc {{.PATH_ERROR}}"
    cmds:
      - find . -maxdepth 50 -name deployment.yaml -exec cat {} \; | kuota-calc --detailed
      - find . -maxdepth 50 -name statefulset.yaml -exec cat {} \; | kuota-calc --detailed
      - find . -maxdepth 50 -name daemonset.yaml -exec cat {} \; | kuota-calc --detailed

  test:k3d:
    desc: Starts your local k3d cluster.
    preconditions:
      - sh: "which k3d"
        msg: "k3d {{.PATH_ERROR}}"
    summary: |
      Creating a k3d cluster

      This command ensures the cluster on k3d will
      be created with all the correct parameters, allowing
      for a declarative setup that requires minimal intervention
      to work. k3d is configured to automatically create an entry
      on your KUBECONFIG file and update it to point towards the cluster.

      All commands that create resources also are specific to the cluster
      name configured on the file ('k3d-demo'), as to avoid creating those
      resoures on non-local clusters that may be on KUBECONFIG file as well.
    cmds:
      - task: cli:clear
      - k3d cluster delete --config config/k3d.yaml
      - k3d cluster create --config config/k3d.yaml
      - task: cli:highlight_normal
      - echo -e "\nYour cluster has been created. Type 'k3d cluster list' to confirm."
      - task: cli:reset
    ignore_error: true

  test:k3d:destroy:
    desc: Destroys your local k3d cluster.
    preconditions:
      - sh: "which k3d"
        msg: "k3d {{.PATH_ERROR}}"
    cmds:
      - task: cli:clear
      - k3d cluster delete --config config/k3d.yaml
      - task: cli:highlight_normal
      - echo -e "\nYour cluster has been destroyed."
      - task: cli:reset
    ignore_error: true

  repos:
    desc: Adds and updates all the required Helm repositories locally.
    preconditions:
      - sh: "which helm"
        msg: "helm {{.PATH_ERROR}}"
    cmds:
      - task: cli:clear
      - task: cli:highlight_bg
      - echo -e "This will add new repositories to your local Helm\n"
      - task: cli:reset
      - helm repo add chaos-mesh https://charts.chaos-mesh.org
      - helm repo add hashicorp https://helm.releases.hashicorp.com
      - helm repo add bitnami https://charts.bitnami.com/bitnami
      - helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
      - helm repo add nginx-stable https://helm.nginx.com/stable
      - helm repo add lwolf-charts http://charts.lwolf.org
      - helm repo add emberstack https://emberstack.github.io/helm-charts
      - helm repo add keyporttech https://keyporttech.github.io/helm-charts/
      - helm repo add agones https://agones.dev/chart/stable
      - helm repo add drone https://charts.drone.io
      - helm repo add botkube https://charts.botkube.io
      - helm repo add mysql-operator https://mysql.github.io/mysql-operator/
      - helm repo add stakater https://stakater.github.io/stakater-charts
      - helm repo add fairwinds-stable https://charts.fairwinds.com/stable
      - helm repo add ananace-charts https://ananace.gitlab.io/charts
      - helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
      - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      - helm repo add pixie-operator https://pixie-operator-charts.storage.googleapis.com
      - helm repo add eraser https://azure.github.io/eraser/charts
      - helm repo add vmware-tanzu https://vmware-tanzu.github.io/helm-charts
      - helm repo add mayastor https://openebs.github.io/mayastor-extensions/
      - task: cli:clear
      - echo -e "This will add new repositories to your local Helm\n"
      - task: cli:highlight_normal
      - echo -e "Finished adding repositories. Updating them now.\n"
      - task: cli:reset
      - helm repo update
    ignore_error: true

  help:
    desc: Show general help and available commands
    cmds:
      - echo "🏠 Homelab Task Runner - Enhanced Automation"
      - echo ""
      - echo "🚀 Quick Start:"
      - echo "  task help:automation            - Automation workflows overview"
      - echo "  task help:maintenance           - Detailed maintenance help"
      - echo "  task status                     - Current cluster status"
      - echo "  task workflow:prepare           - Prepare for maintenance"
      - echo ""
      - echo "🗚 Core Operations:"
      - echo "  task validate                   - Validate Kubernetes manifests"
      - echo "  task lint                       - YAML syntax checking"
      - echo "  task inventory                  - Infrastructure inventory"
      - echo ""
      - echo "🔄 CI/CD Integration:"
      - echo "  task ci:validate                - GitHub Actions validation"
      - echo "  task ci:security                - GitHub Actions security scan"
      - echo "  task ci:status                  - Workflow status and metrics"
      - echo ""
      - 'echo "For complete command list: task --list"'
      - 'echo "For automation help: task help:automation"'

  dns:
    desc: Creates the DNS entry required for the local domain to work.
    preconditions:
      - sh: "which hostctl"
        msg: "hostctl {{.PATH_ERROR}}"
    summary: |
      Configuring Local DNS configuration through hostctl
      This command uses hostctl to manage entries on /etc/hosts on a
      a cross operational system compatible way. This command should work
      on all MacOS, Windows and Linux. It adds all the '*.k8s.localhost'
      domains to your local DNS hosts file. It also makes it easy for the
      user to reverse those changes, avoiding pollution on your hosts
      (or equivalent) file.
    cmds:
      - task: cli:clear
      - sleep 0.01 && {{if eq OS "windows"}}hostctl add k8s -q < config/.etchosts{{else}}sudo hostctl add k8s -q < config/.etchosts{{end}}
      - task: cli:highlight_normal
      - echo -e "Added 'k8s.localhost' and related domains to your hosts file!"
      - task: cli:reset
    ignore_error: true

  inventory:
    desc: Generate comprehensive infrastructure inventory
    cmds:
      - task: maintenance:inventory

  health-check:
    desc: Run comprehensive cluster health check
    cmds:
      - task: maintenance:health:check

  upgrade:cert-manager:
    desc: Upgrade cert-manager with safety checks
    cmds:
      - task: maintenance:upgrade:cert-manager

  upgrade:argocd:
    desc: Upgrade ArgoCD with safety checks
    cmds:
      - task: maintenance:upgrade:argocd

  upgrade:monitoring:
    desc: Upgrade monitoring stack with safety checks
    cmds:
      - task: maintenance:upgrade:monitoring

  backup:create:
    desc: Create cluster backup
    cmds:
      - task: maintenance:backup:create

  backup:restore:
    desc: Restore from cluster backup
    cmds:
      - task: maintenance:backup:restore

  security:scan:
    desc: Run security vulnerability scan
    cmds:
      - task: maintenance:security:scan

  # GitHub Actions Integration
  ci:validate:
    desc: Run GitHub Actions validation workflow
    preconditions:
      - sh: "which gh"
        msg: "GitHub CLI is required for CI integration"
    cmds:
      - echo "🔄 Triggering GitHub Actions validation workflow..."
      - gh workflow run validate.yml --ref {{.GIT_BRANCH | default "main"}}
      - echo "✅ Validation workflow triggered"

  ci:security:
    desc: Run GitHub Actions security scan workflow
    preconditions:
      - sh: "which gh"
        msg: "GitHub CLI is required for CI integration"
    cmds:
      - echo "🔒 Triggering GitHub Actions security scan workflow..."
      - gh workflow run security-scan.yml --ref {{.GIT_BRANCH | default "main"}}
      - echo "✅ Security scan workflow triggered"

  ci:status:
    desc: Check GitHub Actions workflow status
    preconditions:
      - sh: "which gh"
        msg: "GitHub CLI is required for CI status check"
    cmds:
      - echo "📊 Checking GitHub Actions workflow status..."
      - gh run list --limit 10
      - echo ""
      - echo "📈 Workflow Success Rate:"
      - |
        total=$(gh run list --limit 20 --json conclusion | jq length)
        success=$(gh run list --limit 20 --json conclusion | jq '[.[] | select(.conclusion == "success")] | length')
        if [ $total -gt 0 ]; then
          percentage=$(( (success * 100) / total ))
          echo "Success rate: $success/$total ($percentage%)"
        fi

  # Enhanced automation commands
  maintenance:prepare:
    desc: Prepare for maintenance window with comprehensive checks
    cmds:
      - task: maintenance:prepare:full

  maintenance:execute:
    desc: Execute planned maintenance with validation
    cmds:
      - task: maintenance:execute:full

  maintenance:validate:
    desc: Post-maintenance validation and reporting
    cmds:
      - task: maintenance:validate:full

  # Automated remediation commands
  remediate:certificates:
    desc: Automated certificate issue remediation
    cmds:
      - task: maintenance:remediate:certificates

  remediate:pods:
    desc: Automated pod issue remediation
    cmds:
      - task: maintenance:remediate:pods

  # Monitoring and status commands
  health:enhanced:
    desc: Enhanced health check with GitHub Actions integration
    cmds:
      - task: maintenance:health:enhanced

  monitoring:setup:
    desc: Setup monitoring and alerting for maintenance tasks
    cmds:
      - task: maintenance:monitoring:setup

  # Quick command shortcuts
  status:
    desc: Quick cluster and CI/CD status overview
    cmds:
      - task: maintenance:status:overview

  # Automation workflow shortcuts
  workflow:prepare:
    desc: Full maintenance preparation workflow
    cmds:
      - echo "🚀 Starting comprehensive maintenance preparation..."
      - task: maintenance:prepare:full
      - echo "📋 Preparation completed. Ready for maintenance execution."

  workflow:execute:
    desc: Execute maintenance with validation checkpoints
    cmds:
      - echo "⚡ Executing maintenance workflow for all components"
      - task: maintenance:execute:full
      - echo "✅ Maintenance execution completed."

  workflow:validate:
    desc: Comprehensive post-maintenance validation
    cmds:
      - echo "🔍 Running post-maintenance validation workflow..."
      - task: maintenance:validate:full
      - echo "📊 Validation workflow completed."

  # GitHub Actions wait command
  ci:wait:
    desc: Wait for running GitHub Actions workflows to complete
    preconditions:
      - sh: "which gh"
        msg: "GitHub CLI is required"
    cmds:
      - task: maintenance:ci:wait

  run:
    cmds:
      - task: validate
      - task: commit

  # Enhanced help and documentation
  help:maintenance:
    desc: Show comprehensive maintenance automation help
    cmds:
      - task: maintenance:help

  help:automation:
    desc: Show automation workflow help
    cmds:
      - echo "🚀 Homelab Automation Workflows - Enhanced"
      - echo ""
      - echo "📅 Maintenance Workflows:"
      - echo "  task workflow:prepare           - Complete pre-maintenance preparation"
      - echo "  task workflow:execute -- <comp> - Execute maintenance with validation"
      - echo "  task workflow:validate          - Post-maintenance validation"
      - echo ""
      - echo "🔄 GitHub Actions Integration:"
      - echo "  task ci:validate                - Trigger validation workflow"
      - echo "  task ci:security                - Trigger security scan workflow"
      - echo "  task ci:status                  - Check workflow status with metrics"
      - echo "  task ci:wait                    - Wait for workflows to complete"
      - echo ""
      - echo "🔧 Automated Remediation:"
      - echo "  task remediate:certificates     - Fix certificate issues"
      - echo "  task remediate:pods             - Fix pod restart issues"
      - echo ""
      - echo "📊 Enhanced Monitoring:"
      - echo "  task health:enhanced            - Health check with CI/CD integration"
      - echo "  task monitoring:setup           - Setup maintenance monitoring"
      - echo "  task status                     - Comprehensive status overview"
      - echo ""
      - echo "🗚 Legacy Commands (still available):"
      - echo "  task inventory                  - Generate infrastructure inventory"
      - echo "  task health-check               - Run comprehensive health check"
      - echo "  task upgrade:cert-manager       - Upgrade cert-manager"
      - echo "  task upgrade:argocd             - Upgrade ArgoCD"
      - echo "  task upgrade:monitoring         - Upgrade monitoring stack"
      - echo ""
      - 'echo "📁 For detailed maintenance help: task help:maintenance"'
      - 'echo "📆 For complete task list: task --list"'
