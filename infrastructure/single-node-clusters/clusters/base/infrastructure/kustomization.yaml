apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base Infrastructure Components
# Core services shared across all single-node clusters

metadata:
  name: base-infrastructure
  namespace: flux-system

resources:
  # Core Infrastructure
  - sources/
  - namespaces/
  - rbac/
  - networking/
  - storage/
  - monitoring/
  - security/

# Common patches for infrastructure components
patchesStrategicMerge:
  - patches/resource-limits.yaml
  - patches/node-selector.yaml

# Configuration generators
configMapGenerator:
  - name: cluster-info
    literals:
      - cluster-architecture=single-node
      - storage-backend=democratic-csi-nfs
      - ingress-provider=traefik
      - monitoring-stack=prometheus
      - certificate-manager=cert-manager
      - external-secrets=1password-operator

# Secret generators (using sealed secrets or external secrets)
secretGenerator: []

# Resource ordering
# Ensures infrastructure is deployed in correct sequence
transformers:
  - transformers/add-labels.yaml
  - transformers/set-namespace.yaml

# Health checks
healthChecks:
  - apiVersion: apps/v1
    kind: Deployment
    name: traefik
    namespace: traefik-system
  - apiVersion: apps/v1
    kind: Deployment
    name: democratic-csi-controller
    namespace: democratic-csi
  - apiVersion: apps/v1
    kind: Deployment
    name: cert-manager
    namespace: cert-manager