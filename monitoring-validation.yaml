# Monitoring Validation Framework
# Validates Prometheus, alerting, and observability components

apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-validation
  namespace: monitoring
data:
  # Prometheus target validation
  prometheus-validation.sh: |
    #!/bin/bash
    set -euo pipefail
    
    echo "📊 Starting Prometheus validation..."
    
    # Check Prometheus targets
    PROM_URL="http://prometheus.monitoring.svc.cluster.local:9090"
    
    # Validate scraping targets
    curl -s "\$PROM_URL/api/v1/targets" | jq -r '
        .data.activeTargets[] | 
        select(.health != "up") | 
        "\(.labels.job): \(.health) - \(.lastError // "unknown error")"
    ' || echo "⚠️  Unable to check Prometheus targets"
    
    # Check critical metrics availability
    CRITICAL_METRICS=(
        "up"
        "node_cpu_seconds_total"
        "node_memory_MemTotal_bytes"
        "container_cpu_usage_seconds_total"
        "kube_pod_status_phase"
    )
    
    for metric in "\${CRITICAL_METRICS[@]}"; do
        echo "Checking metric: \$metric"
        RESULT=\$(curl -s "\$PROM_URL/api/v1/query?query=\$metric" | jq -r '.data.result | length')
        if [ "\$RESULT" -eq 0 ]; then
            echo "❌ Metric \$metric not available"
        else
            echo "✅ Metric \$metric available (\$RESULT series)"
        fi
    done
    
    echo "✅ Prometheus validation complete"

  # Alert rule validation
  alert-validation.sh: |
    #!/bin/bash
    set -euo pipefail
    
    echo "🚨 Starting alert rule validation..."
    
    PROM_URL="http://prometheus.monitoring.svc.cluster.local:9090"
    
    # Check alert rules
    curl -s "\$PROM_URL/api/v1/rules" | jq -r '
        .data.groups[] | 
        .rules[] | 
        select(.type == "alerting") | 
        "\(.name): \(.state) - \(.health)"
    ' || echo "⚠️  Unable to check alert rules"
    
    # Validate critical alerts are configured
    CRITICAL_ALERTS=(
        "NodeDown"
        "PodCrashLooping"
        "PVCStorageFull"
        "DatabaseDown"
        "HighCPUUsage"
        "HighMemoryUsage"
    )
    
    CONFIGURED_ALERTS=\$(curl -s "\$PROM_URL/api/v1/rules" | jq -r '.data.groups[].rules[] | select(.type == "alerting") | .name')
    
    for alert in "\${CRITICAL_ALERTS[@]}"; do
        if echo "\$CONFIGURED_ALERTS" | grep -q "\$alert"; then
            echo "✅ Alert \$alert is configured"
        else
            echo "⚠️  Alert \$alert is missing"
        fi
    done
    
    echo "✅ Alert validation complete"

  # Grafana dashboard validation
  grafana-validation.sh: |
    #!/bin/bash
    set -euo pipefail
    
    echo "📈 Starting Grafana validation..."
    
    GRAFANA_URL="http://grafana.monitoring.svc.cluster.local:3000"
    
    # Check Grafana health
    HEALTH=\$(curl -s "\$GRAFANA_URL/api/health" | jq -r '.status')
    if [ "\$HEALTH" = "ok" ]; then
        echo "✅ Grafana is healthy"
    else
        echo "❌ Grafana health check failed: \$HEALTH"
    fi
    
    # Check data sources
    curl -s "\$GRAFANA_URL/api/datasources" | jq -r '
        .[] | 
        "\(.name): \(.type) - \(.access)"
    ' || echo "⚠️  Unable to check Grafana data sources"
    
    # Validate essential dashboards exist
    ESSENTIAL_DASHBOARDS=(
        "kubernetes-cluster-monitoring"
        "node-exporter-full"
        "postgresql-database"
        "application-overview"
    )
    
    AVAILABLE_DASHBOARDS=\$(curl -s "\$GRAFANA_URL/api/search" | jq -r '.[].title' | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
    
    for dashboard in "\${ESSENTIAL_DASHBOARDS[@]}"; do
        if echo "\$AVAILABLE_DASHBOARDS" | grep -q "\$dashboard"; then
            echo "✅ Dashboard \$dashboard is available"
        else
            echo "⚠️  Dashboard \$dashboard is missing"
        fi
    done
    
    echo "✅ Grafana validation complete"

  # Log aggregation validation
  logs-validation.sh: |
    #!/bin/bash
    set -euo pipefail
    
    echo "📝 Starting log aggregation validation..."
    
    # Check if log aggregation is configured (Loki/ELK/etc.)
    if kubectl get pods -n monitoring | grep -q loki; then
        echo "Validating Loki log aggregation..."
        
        LOKI_URL="http://loki.monitoring.svc.cluster.local:3100"
        
        # Check Loki health
        curl -s "\$LOKI_URL/ready" && echo "✅ Loki is ready" || echo "❌ Loki is not ready"
        
        # Check log ingestion
        RECENT_LOGS=\$(curl -s "\$LOKI_URL/loki/api/v1/query_range?query={namespace=\"tandoor\"}&start=\$(date -d '5 minutes ago' --iso-8601)&end=\$(date --iso-8601)" | jq -r '.data.result | length')
        
        if [ "\$RECENT_LOGS" -gt 0 ]; then
            echo "✅ Recent logs found: \$RECENT_LOGS entries"
        else
            echo "⚠️  No recent logs found for tandoor namespace"
        fi
        
    elif kubectl get pods -n monitoring | grep -q elasticsearch; then
        echo "Validating Elasticsearch log aggregation..."
        # Add Elasticsearch validation here
        
    else
        echo "⚠️  No log aggregation system detected"
    fi
    
    # Validate log retention policies
    echo "Checking log retention policies..."
    
    echo "✅ Log validation complete"

---
# Monitoring validation job
apiVersion: batch/v1
kind: Job
metadata:
  name: monitoring-validation
  namespace: monitoring
spec:
  template:
    spec:
      serviceAccountName: monitoring-validator
      containers:
      - name: validator
        image: alpine:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          apk add --no-cache curl jq kubectl
          /scripts/prometheus-validation.sh
          /scripts/alert-validation.sh
          /scripts/grafana-validation.sh
          /scripts/logs-validation.sh
        volumeMounts:
        - name: validation-scripts
          mountPath: /scripts
      volumes:
      - name: validation-scripts
        configMap:
          name: monitoring-validation
          defaultMode: 0755
      restartPolicy: Never

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-validator
  namespace: monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-validator-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list"]
- apiGroups: ["monitoring.coreos.com"]
  resources: ["servicemonitors", "prometheusrules"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-validator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitoring-validator-role
subjects:
- kind: ServiceAccount
  name: monitoring-validator
  namespace: monitoring